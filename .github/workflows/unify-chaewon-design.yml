name: CHAEWON ARCHIVE - YEONJI Style & Optimize

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chaewon-unified-design-deploy
  cancel-in-progress: false

jobs:
  unify:
    name: Apply YEONJI-inspired design and verify build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout existing CHAEWON ARCHIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify site exists and do not touch photo data
        run: |
          test -f src/App.tsx
          test -f src/components/PhotoArchive.tsx
          test -f package.json
          test -f public/data/photos.json
      - name: Install safe S21 UI enhancements (preserve existing photo data)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, zipfile, io, pathlib
          data = base64.b64decode('''''')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              for info in archive.infolist():
                  name = pathlib.PurePosixPath(info.filename)
                  if info.is_dir() or name.is_absolute() or '..' in name.parts:
                      raise SystemExit('Unsafe archive entry')
                  out = pathlib.Path.cwd().joinpath(*name.parts)
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(archive.read(info))
          PY
          python3 scripts/unify-chaewon.py
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing app dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check and build CHAEWON ARCHIVE
        run: npm run build
      - name: Commit design files only (never overwrite PHOTO data)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/App.tsx src/main.tsx src/components/PhotoArchive.tsx src/components/ChaewonFeaturedPhotos.tsx src/chaewon-unified.css public/gallery/index.html scripts/unify-chaewon.py
          if git diff --cached --quiet; then
            echo 'Already up to date.'
          else
            git commit -m 'design: align CHAEWON with YEONJI and optimize gallery'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Deploy CHAEWON ARCHIVE
    needs: unify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Publish GitHub Pages
        uses: actions/deploy-pages@v4
