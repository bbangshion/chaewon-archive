name: Import CHAEWON S21 Objekts from WAV ARCHIVE
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate S21 converter
        run: node scripts/sync-wav-s21.mjs --self-test
      - name: Import S21 catalog
        run: node scripts/sync-wav-s21.mjs
      - name: Audit imported data
        run: node scripts/audit-chaewon.mjs
      - name: Commit S21 data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/objekt.json
          if ! git diff --staged --quiet; then
            git commit -m 'data: sync WAV S21 Objekts'
            git push
          fi
