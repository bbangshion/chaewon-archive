      - name: Install image processing dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check 'Pillow>=10.4,<13' 'requests>=2.32,<3'
      - name: Cache same-origin Objekt card art for shareable PNG
        shell: bash
        run: python scripts/cache-chaewon-objekt-posters.py
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install site dependencies
        shell: bash
        run: npm install --no-audit --no-fund
      - name: Typecheck and build site
        shell: bash
        run: npm run build
      - name: Commit only modified source and cached poster cards
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/lib/searchIndex.ts src/components/HomeUpdates.tsx src/components/TournamentArena.tsx src/lib/worldCupPoster.ts scripts/apply-chaewon-worldcup-2026.py scripts/cache-chaewon-objekt-posters.py public/data/objekt-poster-map.json public/objekt-poster
          if test -f src/components/ChaewonFeaturedPhotos.tsx; then
            git add -- src/components/ChaewonFeaturedPhotos.tsx
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix: CHAEWON world cup share PNG and 2026 home photos'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'No source changes to commit.'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish updated CHAEWON ARCHIVE
        id: publish
        uses: actions/deploy-pages@v4
