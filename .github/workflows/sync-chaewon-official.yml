name: CHAEWON PHOTO - Official Instagram
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'discover = collect candidates; publish = manually checked IDs only'
        options: [discover, publish]
        default: discover
        required: true
      max_pages:
        type: choice
        description: 'Number of pages, up to 50 posts per page'
        options: ['1', '2', '5', '10', '20']
        default: '2'
        required: true
      media_ids:
        description: 'publish: comma-separated Instagram media IDs from review JSON'
        required: false
        default: ''
      confirm:
        description: 'publish: VERIFIED_AND_CLEARED (identity + image rights checked)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: chaewon-official-photo-data
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && github.repository == 'bbangshion/chaewon-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image support
        run: python -m pip install 'Pillow>=10.4,<13'
      - name: Scan / publish reviewed official photos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: v24.0
          MODE: ${{ inputs.mode }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MEDIA_IDS: ${{ inputs.media_ids }}
          CONFIRM: ${{ inputs.confirm }}
        run: python scripts/sync-chaewon-official.py
      - name: Commit only CHAEWON photo data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/chaewon-official-instagram-review.json
          if [ -d public/images/chaewon-official ]; then git add -- public/images/chaewon-official; fi
          git add -- public/data/photos.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: sync CHAEWON official SNS photos'
            git push
          fi
