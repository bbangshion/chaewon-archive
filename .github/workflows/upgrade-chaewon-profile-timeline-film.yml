          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              if z.testzip():
                  raise SystemExit('STOP: corrupted embedded patch')
              for name in expected:
                  info = z.getinfo(name)
                  target = pathlib.Path(*pathlib.PurePosixPath(name).parts)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit('STOP: unsafe patch path')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(info))
          print('S21 patch files extracted:',len(expected))
