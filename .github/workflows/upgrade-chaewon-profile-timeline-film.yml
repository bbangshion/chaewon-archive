          python3 scripts/apply-chaewon-editorial.py

      - name: Configure Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install existing app dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript and production build
        run: npm run build

      - name: Verify S21 editorial dataset and existing PHOTO data
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          profile=json.loads(pathlib.Path('public/data/chaewon-editorial.json').read_text())
          films=json.loads(pathlib.Path('public/data/films.json').read_text())
          photos=json.loads(pathlib.Path('public/data/photos.json').read_text())
          assert profile['memberId']=='S21' and len(profile['timeline'])>=10
          assert isinstance(photos,(list,dict))
          rows=films if isinstance(films,list) else films.get('items',films.get('videos',[]))
          ids={row.get('youtubeId') for row in rows if isinstance(row,dict) and 'S21' in row.get('memberIds',[])}
          assert len(ids)>=8, f'Expected >=8 S21 verified videos; got {len(ids)}'
          print('PASS: S21,',len(profile['timeline']),'events,',len(ids),'S21 videos')
          PY

      - name: Commit only S21 profile timeline film changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/ChaewonEditorialData.ts src/components/ProfilePage.tsx src/components/TimelinePage.tsx src/components/ShionFilm.tsx src/main.tsx src/chaewon-editorial.css public/data/chaewon-editorial.json public/data/chaewon-verified-films.json public/data/films.json scripts/apply-chaewon-editorial.py
          git diff --cached --quiet || (git commit -m 'feat: enrich CHAEWON S21 profile timeline and film' && git push origin HEAD:main)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish CHAEWON ARCHIVE
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
