name: CHAEWON S21 - Profile Timeline Film Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chaewon-editorial-s21-upgrade
  cancel-in-progress: false

jobs:
  update:
    name: Apply and build S21 editorial UI
    if: github.repository == 'bbangshion/chaewon-archive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout existing CHAEWON ARCHIVE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check site structure and protect current media data
        shell: bash
        run: |
          test -f src/App.tsx
          test -f src/main.tsx
          test -f package.json
          test -f public/data/photos.json
          test -f public/data/films.json
          test -f src/components/ProfilePage.tsx
          test -f src/components/TimelinePage.tsx
          test -f src/components/ShionFilm.tsx
          git status --porcelain

