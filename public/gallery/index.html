<!doctype html><html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#100D15"/><title>CHAEWON ARCHIVE / GALLERY</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Pretendard',sans-serif;background:#100D15;color:#f8f2fc}a{color:inherit}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:20px max(20px,calc((100vw - 1120px)/2));background:#100D15ed;border-bottom:1px solid #fff2}header strong{letter-spacing:.12em;font-size:12px}header a{color:#c7a3df;text-decoration:none;font-size:12px}main{max-width:1120px;margin:auto;padding:55px 18px}small{letter-spacing:.2em;color:#c7a3df}h1{font-size:clamp(39px,7vw,74px);letter-spacing:-.07em;font-weight:520;margin:16px 0}p{color:#b3a6b9;line-height:1.8}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:28px 0}select,input{border:1px solid #ffffff33;background:#18131f;color:white;padding:11px;border-radius:3px}.grid{columns:2;column-gap:12px}.tile{display:block;width:100%;padding:0;margin:0 0 12px;border:1px solid #ffffff22;background:#18131f;color:inherit;text-align:left;break-inside:avoid;cursor:pointer}.tile img{display:block;width:100%;height:auto}.meta{display:block;padding:12px;font-size:12px}.meta em{display:block;margin-top:6px;font-size:10px;font-style:normal;color:#b3a6b9}.empty{padding:45px 20px;border:1px solid #ffffff23}dialog{border:1px solid #ffffff33;background:#100d15;color:white;width:min(96vw,1050px);max-height:95dvh;padding:15px}dialog::backdrop{background:#05040ae8}.viewer{width:100%;max-height:76dvh;object-fit:contain}.viewerbar{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}.viewerbar button,.viewerbar a{border:1px solid #ffffff36;background:#21172b;color:white;padding:10px 12px;text-decoration:none;cursor:pointer}footer{padding:35px;text-align:center;color:#b3a6b9;font-size:11px}@media(min-width:700px){.grid{columns:3;column-gap:18px}.tile{margin-bottom:18px}}@media(min-width:1040px){.grid{columns:4}}
</style></head><body><header><strong>CHAEWON ARCHIVE</strong><a href="../">HOME ↗</a></header><main><small>PHOTO / S21</small><h1>GALLERY</h1><p>김채원의 사진을 날짜별로 살펴보세요</p><div class="filters"><select id="year" aria-label="연도"><option value="">모든 연도</option></select><input id="search" placeholder="날짜 · 제목 검색" aria-label="사진 검색"><span id="counter" aria-live="polite"></span></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>해당하는 사진이 없습니다</div></main><dialog id="lightbox" aria-label="사진 상세 보기"><div class="viewerbar"><a id="source" target="_blank" rel="noopener noreferrer" hidden>원본 게시물 ↗</a><span>CREATED BY @bbangshion</span><button id="close" type="button">닫기 ✕</button></div><img class="viewer" id="full" alt=""/><p id="caption"></p></dialog><footer>UNOFFICIAL FAN ARCHIVE · CREATED BY @bbangshion</footer><script>
const base=new URL('../',location.href);const grid=document.getElementById('grid'),year=document.getElementById('year'),search=document.getElementById('search'),counter=document.getElementById('counter'),empty=document.getElementById('empty'),dialog=document.getElementById('lightbox'),full=document.getElementById('full'),caption=document.getElementById('caption'),source=document.getElementById('source');let records=[];const label=v=>typeof v==='string'?v:(v&&v.ko)||'';const safeImage=p=>{try{const u=new URL(p,base);return u.protocol==='https:'||u.origin===location.origin?u.href:null}catch{return null}};const validPhoto=p=>p&&p.memberId==='S21'&&p.category==='photo'&&typeof p.image==='string'&&safeImage(p.image);function render(){let term=search.value.trim().toLowerCase();let shown=records.filter(p=>(!year.value||p.date?.startsWith(year.value))&&(!term||[label(p.title),p.date||'',label(p.album)].join(' ').toLowerCase().includes(term)));grid.replaceChildren();counter.textContent=shown.length+'장';empty.hidden=shown.length>0;for(const p of shown){let button=document.createElement('button'),img=document.createElement('img'),meta=document.createElement('span'),text=document.createElement('strong'),date=document.createElement('em');button.type='button';button.className='tile';img.src=safeImage(p.image);img.loading='lazy';img.decoding='async';img.alt=label(p.title)||'김채원';text.textContent=label(p.title)||'김채원';date.textContent=(p.date||'날짜 미확인')+' · 빵시온';meta.className='meta';meta.append(text,date);button.append(img,meta);button.addEventListener('click',()=>{full.src=img.src;full.alt=img.alt;caption.textContent=text.textContent+' · '+date.textContent;try{let u=new URL(p.sourceUrl);source.hidden=u.protocol!=='https:';source.href=source.hidden?'#':u.href}catch{source.hidden=true;source.removeAttribute('href')}dialog.showModal()});grid.append(button)}}document.getElementById('close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});Promise.resolve().then(async()=>{let r=await fetch(new URL('data/photos.json',base),{cache:'no-cache'});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json();records=(Array.isArray(data)?data:data.photos||[]).filter(validPhoto);records.sort((a,b)=>(b.date||'').localeCompare(a.date||''));let years=[...new Set(records.map(p=>p.date?.slice(0,4)).filter(Boolean))].sort().reverse();for(let y of years){let op=document.createElement('option');op.value=y;op.textContent=y;year.append(op)}render()}).catch(()=>{empty.hidden=false;empty.textContent='사진 데이터를 불러올 수 없습니다'});year.onchange=render;search.oninput=render;
</script></body></html>
