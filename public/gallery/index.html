<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b090e" />
<meta name="description" content="S21 김채원 사진 아카이브 — 활동·연도·출처별 컬렉션" />
<title>PHOTO COLLECTION — CHAEWON ARCHIVE</title>
<style>
:root { color-scheme:dark; --ink:#0b090e; --surface:#17121b; --border:rgba(229,207,243,.16); --accent:#c7a3df; --light:#f7f2f8; --dim:#aaa0b0; }
* {box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0; background:var(--ink); color:var(--light); font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif; -webkit-font-smoothing:antialiased; min-width:320px}
a {color:inherit} button,input,select{font:inherit}button{cursor:pointer} :focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.top{position:sticky;top:0;z-index:30;background:#0b090ef2;border-bottom:1px solid var(--border)}
.top-inner{max-width:1250px;margin:auto;min-height:73px;padding:15px clamp(18px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{text-decoration:none;white-space:nowrap;font-weight:600;letter-spacing:.14em;font-size:12px}.brand b{font:normal 23px Georgia,serif;color:var(--accent);border:1px solid var(--border);border-radius:50%;display:inline-grid;place-items:center;width:35px;height:35px;margin-right:10px}
.top-controls{display:flex;gap:10px;align-items:center}.top-controls select,.back{color:var(--light);background:none;border:1px solid var(--border);border-radius:2px;padding:10px 12px;font-size:11px;text-decoration:none;letter-spacing:.03em}
.wrap{max-width:1250px;margin:0 auto;padding:0 clamp(18px,4vw,48px)}
.hero{padding:clamp(55px,9vw,112px) 0 49px;border-bottom:1px solid var(--border)}
.kicker{font-size:10px;letter-spacing:.22em;font-weight:600;color:var(--accent);margin:0 0 24px}
.hero h1{font-weight:500;letter-spacing:-.07em;font-size:clamp(52px,9.2vw,117px);line-height:.9;margin:0}
.hero .sub{font-family:Georgia,serif;font-size:clamp(20px,2.7vw,29px);font-style:italic;font-weight:400;letter-spacing:0;color:var(--accent)}
.hero-bottom{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:28px 0 0}.hero-bottom p{font-size:12px;line-height:1.8;color:var(--dim);margin:0}
.hero-count{text-align:right;display:flex;flex-direction:column;gap:3px}.hero-count strong{font-size:clamp(32px,5vw,58px);font-weight:400;font-variant-numeric:tabular-nums;line-height:1}.hero-count span{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.tools{padding:25px 0 28px;border-bottom:1px solid var(--border)}
.category-pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.category-pills button{border:1px solid var(--border);padding:10px 15px;background:transparent;color:var(--dim);font-size:11px;border-radius:2px;transition:background .2s,color .2s}.category-pills button[aria-pressed="true"]{background:var(--accent);color:#1b1122;border-color:var(--accent);font-weight:650}
.filterbar{display:grid;grid-template-columns:minmax(0,1fr) 135px 150px;gap:9px}.filterbar input,.filterbar select{width:100%;min-width:0;background:var(--surface);color:var(--light);padding:14px 15px;border-radius:2px;border:1px solid var(--border);font-size:12px}.filterbar input::placeholder{color:#837b89}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:27px 0 21px}.result strong{font-size:12px;font-weight:500}.result span{color:var(--dim);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:25px 13px;min-height:200px}
.card{margin:0;min-width:0}.photo-button{display:block;width:100%;padding:0;border:0;background:#231a28;text-align:left;aspect-ratio:3/4;overflow:hidden;position:relative}.photo-button img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s ease}.photo-button:hover img{transform:scale(1.03)}.photo-button .num{position:absolute;top:10px;left:10px;background:#0c071980;color:#fff;padding:4px 6px;font:11px Georgia,serif}
.caption{margin-top:10px;display:flex;justify-content:space-between;gap:7px;align-items:baseline}.caption strong{font-weight:600;font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.caption small{color:var(--dim);font-size:10px;flex-shrink:0}
.empty{padding:70px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.9}.more{display:block;margin:45px auto 75px;background:transparent;color:var(--light);border:1px solid var(--border);padding:15px 40px;border-radius:2px;font-size:12px}
.end{padding:29px 0 38px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--dim)}
.dialog{position:fixed;inset:0;z-index:100;background:rgba(5,3,8,.98);display:none;flex-direction:column}.dialog[aria-hidden="false"]{display:flex}.dialog-top{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--border);gap:12px}.dialog-top p{margin:0;font-size:11px;color:var(--dim)}.dialog-top button,.dialog-controls button{border:1px solid var(--border);background:#1a1421;color:var(--light);padding:10px 16px;border-radius:2px;font-size:12px}.dialog-body{min-height:0;flex:1;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px max(12px,env(safe-area-inset-left))}.dialog-body img{display:block;max-width:min(100%,1000px);max-height:calc(100dvh - 222px);width:auto;height:auto;object-fit:contain}.step{border:0;background:none;color:var(--light);font-size:40px;padding:8px 10px}.dialog-footer{min-height:95px;padding:18px 24px max(18px,env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:14px;align-items:center}.dialog-info{min-width:0;display:flex;flex-direction:column;gap:4px}.dialog-info strong{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dialog-info small{font-size:11px;color:var(--dim)}.dialog-controls{display:flex;gap:7px;flex-shrink:0}.dialog-controls a{border:1px solid var(--border);background:#1a1421;color:var(--light);padding:10px 13px;font-size:11px;text-decoration:none;border-radius:2px}
@media(max-width:1050px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:720px){.top-inner{min-height:62px;padding:11px 16px}.brand{font-size:10px;letter-spacing:.09em}.brand b{margin-right:6px;width:30px;height:30px}.back{display:none}.hero{padding:66px 0 42px}.hero h1{font-size:clamp(50px,13vw,80px)}.hero-bottom{align-items:end}.hero-bottom p{max-width:235px}.filterbar{grid-template-columns:1fr 110px}.filterbar input{grid-column:span 2}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 9px}.caption small{display:none}.dialog-body{gap:0;padding:9px 0}.step{font-size:28px;padding:3px 9px}.dialog-body img{max-width:calc(100vw - 85px)}.dialog-footer{padding:14px 12px;flex-direction:column;align-items:stretch;gap:10px}.dialog-body img{max-height:calc(100dvh - 246px)}.dialog-controls{justify-content:flex-end}.end{font-size:10px}}
@media(max-width:450px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}.hero-bottom{margin-top:25px}.category-pills button{padding:9px 12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.photo-button img{transition:none!important;transform:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><a href="../" class="brand"><b>C</b>CHAEWON <span style="font-weight:400">ARCHIVE</span></a><div class="top-controls"><a class="back" href="../" id="back">← 아카이브</a><select id="lang" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option></select></div></div></header>
<main><section class="hero"><div class="wrap"><p class="kicker">TRIPLES / S21 &nbsp;·&nbsp; THE COMPLETE PHOTO COLLECTION</p><h1>CHAEWON<br/><span class="sub">Photo Collection</span></h1><div class="hero-bottom"><p id="desc">김채원의 사진을 활동과 출처별로 정리했습니다.<br/>확인되지 않은 촬영 날짜는 임의로 표시하지 않습니다.</p><div class="hero-count"><strong id="total">—</strong><span>PHOTOGRAPHS</span></div></div></div></section>
<section class="tools"><div class="wrap"><nav id="categories" class="category-pills" aria-label="Category"></nav><div class="filterbar"><input type="search" id="search" autocomplete="off" placeholder="사진·활동·출처 검색" aria-label="Search photographs"/><select id="year" aria-label="Year"><option value="all">모든 연도</option></select><select id="sort" aria-label="Order"><option value="new">최신순</option><option value="old">오래된순</option><option value="added">등록순</option></select></div></div></section>
<section class="wrap"><div class="result"><strong id="resultTitle">전체 사진</strong><span id="resultCount">—</span></div><div id="grid" class="grid" aria-live="polite"></div><p id="empty" class="empty" hidden>사진을 불러오는 중입니다.</p><button id="more" class="more" type="button" hidden>더 보기 ↓</button></section></main>
<footer class="end wrap"><span>CURATED BY @bbangshion</span><span id="sourceNote">© Original photographers / respective owners</span></footer>
<div class="dialog" id="viewer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Photo viewer"><div class="dialog-top"><p id="counter"></p><button id="close" type="button">닫기 ×</button></div><div class="dialog-body"><button type="button" class="step" id="prev" aria-label="Previous photo">‹</button><img alt="" id="large"/><button type="button" class="step" id="next" aria-label="Next photo">›</button></div><div class="dialog-footer"><div class="dialog-info"><strong id="photoTitle"></strong><small id="photoMeta"></small></div><div class="dialog-controls"><a id="origin" target="_blank" rel="noopener noreferrer">원본</a><button id="share" type="button">링크 복사</button></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id); const state={all:[],filtered:[],cat:'all',year:'all',sort:'new',term:'',visible:36,index:-1,language:'ko'};
const dict={ko:{all:'전체',promotional:'공식 콘셉트',pictorial:'화보',misc:'프로필·기타',behind:'비하인드',stages:'무대·공연',other:'기타',allYears:'모든 연도',unknown:'연도 미확인',dateUnknown:'촬영일 미확인',search:'사진·활동·출처 검색',new:'최신순',old:'오래된순',added:'등록순',results:'장의 사진',more:'더 보기 ↓',none:'조건에 맞는 사진이 없습니다.',copy:'링크 복사',copied:'복사 완료',source:'원본',close:'닫기 ×',desc:'김채원의 사진을 활동과 출처별로 정리했습니다. 확인되지 않은 촬영 날짜는 임의로 표시하지 않습니다.',back:'← 아카이브'},
 en:{all:'All',promotional:'Promotional',pictorial:'Pictorial',misc:'Profile / Other',behind:'Behind',stages:'Stage',other:'Other',allYears:'All years',unknown:'Year unknown',dateUnknown:'Date unverified',search:'Search photo, activity, source',new:'Newest',old:'Oldest',added:'Added order',results:'photos',more:'Show more ↓',none:'No matching photographs.',copy:'Copy link',copied:'Copied',source:'Source',close:'Close ×',desc:'A curated photo archive of Kim ChaeWon. Unverified dates are not invented.',back:'← Archive'},
 ja:{all:'すべて',promotional:'コンセプト',pictorial:'グラビア',misc:'プロフィール・その他',behind:'ビハインド',stages:'ステージ',other:'その他',allYears:'すべての年',unknown:'年不明',dateUnknown:'撮影日未確認',search:'写真・活動・出典を検索',new:'新しい順',old:'古い順',added:'登録順',results:'枚',more:'もっと見る ↓',none:'該当する写真がありません。',copy:'リンクをコピー',copied:'コピーしました',source:'元の投稿',close:'閉じる ×',desc:'キム・チェウォンのフォトアーカイブです。未確認の日付は作成しません。',back:'← アーカイブ'}};
function str(v,f=''){if(typeof v==='string')return v||f;if(v&&typeof v==='object')return v[state.language]||v.ko||v.en||f;return f}
function safeImg(value){if(typeof value!=='string')return null;if(/^https:\/\//i.test(value))return value;if(/^(?!\/)(?!\.)(?!.*\/\.{1,2}\/)[a-z0-9_./%\-]+\.(webp|avif|png|jpe?g)$/i.test(value))return '../'+value;return null}
function safeLink(value){try {const u=new URL(value);return u.protocol==='https:'?u.href:null}catch(_){return null}}
function cat(row){let s=[str(row.album),...(Array.isArray(row.tags)?row.tags:[])].join(' ').toLowerCase();if(/promot|콘셉트|컨셉|프로모션/.test(s))return'promotional';if(/pictorial|화보|매거진|magazine/.test(s))return'pictorial';if(/behind|비하인드|현장/.test(s))return'behind';if(/stage|공연|무대/.test(s))return'stages';if(/misc|프로필|기타/.test(s))return'misc';return'other'}
function validDay(day){if(typeof day!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(day))return null;const d=new Date(day+'T00:00:00Z');return !isNaN(d.valueOf())&&d.toISOString().slice(0,10)===day?day:null}
function yearOf(row){const d=validDay(row.date);return d?d.slice(0,4):typeof row.year==='string'&&/^20\d{2}$/.test(row.year)?row.year:'unknown'}
function allRows(raw){const r=Array.isArray(raw)?raw:raw&&Array.isArray(raw.photos)?raw.photos:[];const used=new Set();return r.map((row,pos)=>{if(!row||typeof row!=='object'||row.category&&row.category!=='photo')return null;const img=safeImg(row.image),id=String(row.id||'');if(!img||!id||used.has(id))return null;used.add(id);return {id,img,row,cat:cat(row),year:yearOf(row),day:validDay(row.date),pos}}).filter(Boolean)}
const t=()=>dict[state.language]; const categories=['all','promotional','pictorial','misc','behind','stages','other'];
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function translate(){document.documentElement.lang=state.language;$('search').placeholder=t().search;$('search').setAttribute('aria-label',t().search);$('back').textContent=t().back;$('close').textContent=t().close;$('origin').textContent=t().source;$('share').textContent=t().copy;$('desc').textContent=t().desc;$('more').textContent=t().more;$('sort').options[0].textContent=t().new;$('sort').options[1].textContent=t().old;$('sort').options[2].textContent=t().added;$('sourceNote').textContent='© Original photographers / respective owners';renderCategories();renderYears();filter()}
function renderCategories(){const host=$('categories');host.replaceChildren();let counts=Object.fromEntries(categories.map(k=>[k,0]));state.all.forEach(p=>{counts.all++;counts[p.cat]++});categories.forEach(k=>{if(k!=='all'&&!counts[k])return;const b=node('button','',t()[k]+' '+counts[k]);b.type='button';b.setAttribute('aria-pressed',String(state.cat===k));b.addEventListener('click',()=>{state.cat=k;state.visible=36;renderCategories();filter()});host.appendChild(b)})}
function renderYears(){const sel=$('year'),saved=state.year;sel.replaceChildren(new Option(t().allYears,'all'));const years=[...new Set(state.all.map(p=>p.year))].sort((a,b)=>a==='unknown'?1:b==='unknown'?-1:b.localeCompare(a));years.forEach(y=>sel.add(new Option(y==='unknown'?t().unknown:y,y)));if([...sel.options].some(x=>x.value===saved))sel.value=saved;else state.year=sel.value='all'}
function order(a,b){if(state.sort==='added')return a.pos-b.pos;if(a.day&&!b.day)return-1;if(!a.day&&b.day)return 1;const da=a.day||'',db=b.day||'';return (state.sort==='new'?db.localeCompare(da):da.localeCompare(db))||a.pos-b.pos}
function filter(){const term=state.term.trim().toLowerCase();state.filtered=state.all.filter(p=>(state.cat==='all'||state.cat===p.cat)&&(state.year==='all'||state.year===p.year)&&(!term||[str(p.row.title),str(p.row.album),p.year,p.day,...(Array.isArray(p.row.tags)?p.row.tags:[])].filter(Boolean).join(' ').toLowerCase().includes(term))).sort(order);$('resultTitle').textContent=t()[state.cat];$('resultCount').textContent=state.filtered.length.toLocaleString()+' '+t().results;renderGrid()}
function renderGrid(){const host=$('grid');host.replaceChildren();let arr=state.filtered.slice(0,state.visible);const frag=document.createDocumentFragment();arr.forEach((p,i)=>{const figure=node('figure','card');const button=node('button','photo-button');button.type='button';button.setAttribute('aria-label',str(p.row.title,'Kim ChaeWon'));const im=node('img');im.src=p.img;im.alt=str(p.row.title,'Kim ChaeWon');im.loading='lazy';im.decoding='async';im.draggable=false;button.append(im,node('span','num',String(i+1).padStart(2,'0')));button.addEventListener('click',()=>show(i));const cap=node('figcaption','caption');cap.append(node('strong','',str(p.row.album,'PHOTO')),node('small','',p.day|| (p.year!=='unknown'?p.year:t().dateUnknown)));figure.append(button,cap);frag.appendChild(figure)});host.appendChild(frag);$('more').hidden=state.filtered.length<=state.visible;$('empty').hidden=state.filtered.length>0;$('empty').textContent=state.all.length===0?'PHOTO DATA NOT AVAILABLE':t().none}
let previousFocus=null;function show(i){const p=state.filtered[i];if(!p)return;previousFocus=document.activeElement;state.index=i;$('viewer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('counter').textContent=`${i+1} / ${state.filtered.length}`;$('large').src=p.img;$('large').alt=str(p.row.title,'Kim ChaeWon');$('photoTitle').textContent=str(p.row.title,'Kim ChaeWon');$('photoMeta').textContent=[str(p.row.album,'PHOTO'),p.day|| (p.year!=='unknown'?`${p.year} · ${t().dateUnknown}`:t().dateUnknown)].join(' · ');const src=safeLink(p.row.sourceUrl||p.row.source);$('origin').hidden=!src;$('origin').removeAttribute('href');if(src)$('origin').href=src;const url=new URL(location.href);url.searchParams.set('photo',p.id);history.replaceState(null,'',url);$('close').focus()}
function hide(){if($('viewer').getAttribute('aria-hidden')==='true')return;$('viewer').setAttribute('aria-hidden','true');document.body.style.overflow='';$('large').removeAttribute('src');state.index=-1;const url=new URL(location.href);url.searchParams.delete('photo');history.replaceState(null,'',url);previousFocus?.focus?.()}
function step(d){if(state.index<0||state.filtered.length===0)return;show((state.index+d+state.filtered.length)%state.filtered.length)}
$('close').onclick=hide;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('viewer').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();hide()}if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key==='Tab'){const nodes=[...$('viewer').querySelectorAll('button:not([hidden]),a:not([hidden])')].filter(el=>!el.hidden);if(nodes.length){const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))hide()});let touchStart=null;$('large').addEventListener('touchstart',e=>{touchStart=e.touches[0]?.clientX??null},{passive:true});$('large').addEventListener('touchend',e=>{const x=e.changedTouches[0]?.clientX;if(touchStart!==null&&x!==undefined&&Math.abs(x-touchStart)>65)step(x<touchStart?1:-1);touchStart=null},{passive:true});
$('share').onclick=async()=>{const p=state.filtered[state.index];if(!p)return;const url=new URL(location.href);url.searchParams.set('photo',p.id);try {await navigator.clipboard.writeText(url.href);$('share').textContent=t().copied;setTimeout(()=>$('share').textContent=t().copy,1200)} catch (_) {prompt('Copy link',url.href)}};
let searchTimer=0; $('search').oninput=e=>{const value=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.term=value;state.visible=36;filter()},130)};$('year').onchange=e=>{state.year=e.target.value;state.visible=36;filter()};$('sort').onchange=e=>{state.sort=e.target.value;state.visible=36;filter()};$('more').onclick=()=>{state.visible+=36;renderGrid()};$('lang').onchange=e=>{state.language=e.target.value;try{localStorage.setItem('cw_gallery_lang',state.language)}catch(_){}translate()};
try{const saved=localStorage.getItem('cw_gallery_lang');if(dict[saved])state.language=saved}catch(_){}$('lang').value=state.language;
fetch('../data/photos.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{state.all=allRows(data);$('total').textContent=state.all.length.toLocaleString();translate();const requested=new URL(location.href).searchParams.get('photo');if(requested){const idx=state.filtered.findIndex(p=>p.id===requested);if(idx!==-1)show(idx)}}).catch(()=>{$('total').textContent='0';translate();$('empty').textContent='사진 데이터를 불러오지 못했습니다.'});
})();
</script>
</body>
</html>
